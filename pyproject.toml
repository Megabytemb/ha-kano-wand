[project]
name = "kano-wand"
version = "1.2.0"
description = "Home Assistant custom integration for the Kano Coding Wand over Bluetooth Low Energy (BLE) and ESPHome Bluetooth Proxies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "bleak-retry-connector>=4.7.1",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
